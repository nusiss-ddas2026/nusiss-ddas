services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddas
      POSTGRES_USER: ddas
      POSTGRES_PASSWORD: ddas
    ports:
      - "5432:5432"
    volumes:
      - ddas-postgres-data:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

volumes:
  ddas-postgres-data:
