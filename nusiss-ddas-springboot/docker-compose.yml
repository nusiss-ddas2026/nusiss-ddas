services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ddas
      POSTGRES_USER: ddas
      POSTGRES_PASSWORD: ddas
    ports:
      - "5432:5432"
    volumes:
      - ddas-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-tls/certs:/certs-ro:ro
      - ./docker/postgres-tls/pg-entrypoint.sh:/usr/local/bin/pg-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/pg-entrypoint.sh"]

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/ddas-realm.json:/opt/keycloak/data/import/ddas-realm.json:ro
      - ./keycloak/themes/ddas:/opt/keycloak/themes/ddas:ro

volumes:
  ddas-postgres-data:
