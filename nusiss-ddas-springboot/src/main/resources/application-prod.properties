# Production profile (SPRING_PROFILES_ACTIVE=prod). Every secret comes from the environment
# with NO default, so the app refuses to start if one is missing.
spring.datasource.url=jdbc:postgresql://postgres:5432/${DB_NAME:ddas}
spring.datasource.username=${DB_USER:ddas}
spring.datasource.password=${DB_PASSWORD}

app.storage.upload-dir=/data/uploads

app.vault.uri=${VAULT_ADDR:http://vault:8200}
app.vault.token=${VAULT_APP_TOKEN}

app.jwt.secret=${JWT_SECRET}

app.seed.admin-password=${SEED_ADMIN_PASSWORD}
app.seed.user-password=${SEED_USER_PASSWORD}
app.seed.manager-password=${SEED_MANAGER_PASSWORD}

# Behind Caddy (TLS terminates there): trust X-Forwarded-* so audit logs get the real client IP
server.forward-headers-strategy=framework
app.cookie.secure=true
