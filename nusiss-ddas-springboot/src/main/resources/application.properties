spring.datasource.url=jdbc:postgresql://localhost:5432/ddas
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ddas
spring.datasource.password=ddas

# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.upload-dir=./uploads
