spring.datasource.url=jdbc:postgresql://localhost:5432/ddas?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ddas
spring.datasource.password=ddas

# Flyway owns the schema; Hibernate only validates entity mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.upload-dir=./uploads

# --- HashiCorp Vault (dev mode via docker-compose;) ---
app.vault.uri=http://localhost:8200
app.vault.token=dev-only-root-token
app.vault.transit.key-name-prefix=document-signing

# JWT Configuration
app.jwt.secret=YourSuperSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm!!!
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# --- OIDC login via local Keycloak (docker-compose; dev only) ---
spring.security.oauth2.client.registration.keycloak.client-id=ddas-app
spring.security.oauth2.client.registration.keycloak.client-secret=ddas-app-dev-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8081/realms/ddas
