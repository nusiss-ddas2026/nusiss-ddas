<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>Register</h2>
            
            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>
                
                <button type="submit" class="btn">Register</button>
            </form>
            
            <p class="register-link">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </p>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/login?registered=true';
                } else {
                    const errorDiv = document.querySelector('.error-message');
                    if (errorDiv) errorDiv.textContent = data.error;
                }
            } catch (error) {
                const errorDiv = document.querySelector('.error-message');
                if (errorDiv) errorDiv.textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
