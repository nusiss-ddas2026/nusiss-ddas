<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>Login</h2>
            
            <div th:if="${param.registered}" class="success-message">
                Registration successful! Please login.
            </div>
            
            <div th:if="${param.logout}" class="success-message">
                You have been logged out successfully.
            </div>
            
            <div th:if="${param.error}" class="error-message">
                Invalid username or password!
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div style="text-align: center;">
                    <button type="submit" class="btn btn-login">Login</button>
                </div>
            </form>
            
            <p class="register-link">
                Don't have an account? <a th:href="@{/register}">Register here</a>
            </p>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', username);
                    window.location.href = '/home';
                } else {
                    const errorDiv = document.querySelector('.error-message');
                    if (errorDiv) errorDiv.textContent = data.error || 'Invalid username or password!';
                }
            } catch (error) {
                const errorDiv = document.querySelector('.error-message');
                if (errorDiv) errorDiv.textContent = 'Connection error';
            }
        });
    </script>
</body>
</html>
