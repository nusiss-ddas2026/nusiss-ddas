<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>Upload Document</h2>

            <div th:if="${error}" class="error-message">
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/uploadDocument}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="docName">Document Name</label>
                    <input type="text" id="docName" name="docName" required autofocus>
                </div>

                <div class="form-group">
                    <label for="docType">Document Type</label>
                    <select id="docType" name="docType" required>
                        <option value="LEAVE">Leave</option>
                        <option value="PROCUREMENT">Procurement</option>
                        <option value="MEDICAL">Medical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="file">File (PDF, DOC, DOCX, JPG or PNG, max 10MB)</label>
                    <input type="file" id="file" name="file"
                           accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
                </div>

                <button type="submit" class="btn">Upload</button>
            </form>

            <p class="register-link">
                <a th:href="@{/home}">Back to My Documents</a>
            </p>
        </div>
    </div>
</body>
</html>
